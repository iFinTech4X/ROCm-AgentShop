[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tapay-zhigou"
version = "0.1.0"
description = "TAPay Chinese shopping assistant with a transactional sandbox"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<0.120", "uvicorn>=0.30,<0.36", "httpx>=0.27,<0.29",
  "pydantic==2.10.6", "langchain==0.3.18", "langchain-core==0.3.35",
  "langchain-openai==0.2.2", "langgraph==0.2.71", "python-dotenv>=1.0,<2"
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
